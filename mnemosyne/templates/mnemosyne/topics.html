{% extends 'mnemosyne/base.html' %}

{% block content %}

<p>Topics</p>
<ul>
    {% for topic in topics %}
    <li>
        <a href="{% url 'mnemosyne:topic' topic.id %}">
            {{ topic.text }}</a>
    </li>
    </li>
    {% empty %}
    <li>No topics have been added yet.</li>
    {% endfor %}
</ul>

<a href="{% url 'mnemosyne:new_topic' %}">Add a new topic</a>

{% endblock content %}
